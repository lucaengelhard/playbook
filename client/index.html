<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Playbook</title>

        <script defer type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <form>
            <label for="sftp_host">Host</label>
            <input type="text" id="sftp_host" name="sftp_host" /><br />
            <label for="sftp_port">Port</label>
            <input type="text" id="sftp_port" name="sftp_port" /><br />
            <label for="sftp_pwd">Password</label>
            <input type="text" id="sftp_pwd" name="sftp_pwd" /><br />
            <label for="sftp_user">User</label>
            <input type="text" id="sftp_user" name="sftp_user" /><br />
            <button id="sftp">Connect to SFTP</button>
        </form>
        <form>
            <label for="form_title">Titel:</label>
            <input type="text" id="form_title" name="form_title" /><br />
            <label for="form_hero">Hero Image:</label>
            <button id="form_hero">Select...</button>
            <div id="form_hero_selected"></div>
            <label for="form_content">Content:</label><br />
            <textarea name="form_content" id="form_content"></textarea><br />
            <button id="form_submit">Submit</button>
        </form>
    </body>
</html>
